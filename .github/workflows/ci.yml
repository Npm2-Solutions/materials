name: CI

# Same shape as worgify's (guide 23 §4): CI runs on version-16 and on demand,
# never on develop pushes. The sibling apps this one requires are private: the
# job clones them with the organisation's SIBLING_REPOS_PAT secret (as weldtrack
# does). Added 2026-10-08 (Design 55 finding GO-F2): materials's tests ran only by hand.
on:
  push:
    branches: [version-16]
  pull_request:
    branches: [version-16]
  workflow_dispatch:

concurrency:
  group: ci-materials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
        continue-on-error: true

  tests:
    name: Tests (Frappe v16)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: apps/materials

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev

      - name: Configure MariaDB charset
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Git auth for the sibling private repos
        run: |
          git config --global url."https://${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Init bench (frappe version-16)
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch version-16 --python "$(which python)" frappe-bench

      - name: Install the required apps, the app, and a test site
        working-directory: frappe-bench
        run: |
          bench get-app https://github.com/Npm2-Solutions/worgify --branch version-16
          bench get-app materials "$GITHUB_WORKSPACE/apps/materials"
          bench new-site test_site \
            --db-host 127.0.0.1 --db-port 3306 \
            --mariadb-root-password root --admin-password admin \
            --no-mariadb-socket
          bench --site test_site set-config redis_cache "redis://127.0.0.1:6379"
          bench --site test_site set-config redis_queue "redis://127.0.0.1:6379"
          bench --site test_site set-config redis_socketio "redis://127.0.0.1:6379"
          bench --site test_site set-config developer_mode 1
          bench --site test_site set-config allow_tests true
          bench --site test_site install-app worgify materials

      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app materials
